services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
      POSTGRES_DB: family_archive
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_archive"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: deps
    restart: unless-stopped
    ports:
      - "3844:3844"
    environment:
      DATABASE_URL: postgresql://family:family@db:5432/family_archive
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-please-32-chars-min}
      FAMILY_ADMIN_EMAIL: ${FAMILY_ADMIN_EMAIL:-admin@family.local}
      FAMILY_ADMIN_PASSWORD: ${FAMILY_ADMIN_PASSWORD:-FamilyAdmin123!}
      UPLOAD_DIR: /app/data/uploads
      APP_URL: http://localhost:3844
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - uploads:/app/data/uploads
    # The `deps` stage ships no entrypoint, but a cached image built from the full
    # Dockerfile still carries the production `./entrypoint.sh`. Clear it explicitly so
    # the dev command below runs (otherwise the service dies on a missing entrypoint),
    # and keep stderr visible so a failed install is not mistaken for a silent success.
    entrypoint: []
    command: sh -c "npm install --prefer-offline && node node_modules/prisma/build/index.js migrate deploy && npm run dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  node_modules:
  uploads: