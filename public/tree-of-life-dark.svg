<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    Monochrome heritage tree silhouette for the dark sidebar.
    Rendered as a decorative watermark (low opacity, white on navy).
    Motif: roots -> trunk -> branches -> canopy with family-node dots.
  -->
  <defs>
    <g id="th-leaf">
      <path d="M0 0C3.6-2.7 7.2-2.7 9.8 0 7.2 2.7 3.6 2.7 0 0Z"/>
    </g>
    <g id="th-node">
      <circle r="2.4"/>
    </g>
  </defs>

  <!-- ============ canopy branches ============ -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- main fork -->
    <path d="M100 128C86 122 74 112 66 98 60 88 58 78 60 68" stroke-width="3.2"/>
    <path d="M100 128C114 122 126 112 134 98 140 88 142 78 140 68" stroke-width="3.2"/>
    <!-- second fork -->
    <path d="M100 112C90 106 82 97 78 86 75 78 74 70 75 62" stroke-width="2.6"/>
    <path d="M100 112C110 106 118 97 122 86 125 78 126 70 125 62" stroke-width="2.6"/>
    <!-- upper fork -->
    <path d="M100 100C94 92 90 82 90 72 90 64 92 56 95 49" stroke-width="2.2"/>
    <path d="M100 100C106 92 110 82 110 72 110 64 108 56 105 49" stroke-width="2.2"/>
    <!-- crown centre -->
    <path d="M100 96C100 86 100 76 100 66 100 58 100 50 100 42" stroke-width="2.4"/>
    <path d="M100 66C96 58 95 50 97 42" stroke-width="1.6"/>
    <path d="M100 66C104 58 105 50 103 42" stroke-width="1.6"/>
    <!-- fine twigs -->
    <path d="M66 98C58 96 52 99 48 105" stroke-width="1.4"/>
    <path d="M134 98C142 96 148 99 152 105" stroke-width="1.4"/>
    <path d="M60 68C54 62 51 54 53 46" stroke-width="1.4"/>
    <path d="M140 68C146 62 149 54 147 46" stroke-width="1.4"/>
    <path d="M78 86C72 80 69 72 71 64" stroke-width="1.4"/>
    <path d="M122 86C128 80 131 72 129 64" stroke-width="1.4"/>
    <path d="M90 72C84 66 82 58 85 50" stroke-width="1.3"/>
    <path d="M110 72C116 66 118 58 115 50" stroke-width="1.3"/>
    <path d="M100 42C92 38 86 32 84 24" stroke-width="1.3"/>
    <path d="M100 42C108 38 114 32 116 24" stroke-width="1.3"/>
    <path d="M100 116C96 110 93 104 92 96" stroke-width="1.4"/>
    <path d="M100 116C104 110 107 104 108 96" stroke-width="1.4"/>
  </g>

  <!-- ============ trunk ============ -->
  <path
    d="M95 192C94 172 96 152 98 134 99 126 100 120 100 114 100 120 101 126 102 134 104 152 106 172 105 192 103 194.5 97 194.5 95 192Z"
    fill="#ffffff"
  />
  <!-- trunk filigree -->
  <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
    <path d="M100 184c-4-2-5.5-5-4.5-8s4-3.5 5.5-1.5-1 4.5-3 3.5"/>
    <path d="M100 170c4-2 5.5-5 4.5-8s-4-3.5-5.5-1.5 1 4.5 3 3.5"/>
    <path d="M100 156c-3.5-2-5-4.5-4-7s3.5-3 5-1.5-1 4-2.5 3"/>
  </g>

  <!-- ============ roots ============ -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M100 191C92 190 84 186 78 179" stroke-width="2.4"/>
    <path d="M100 191C108 190 116 186 122 179" stroke-width="2.4"/>
    <path d="M100 191C95 188 91 182 89 175" stroke-width="1.8"/>
    <path d="M100 191C105 188 109 182 111 175" stroke-width="1.8"/>
    <path d="M100 189C100 183 100 177 100 172" stroke-width="1.4"/>
    <path d="M78 179C74 175 71 170 70 165" stroke-width="1.3"/>
    <path d="M122 179C126 175 129 170 130 165" stroke-width="1.3"/>
  </g>

  <!-- ============ canopy leaves ============ -->
  <g fill="#ffffff">
    <use href="#th-leaf" transform="translate(100 42) rotate(-62)"/>
    <use href="#th-leaf" transform="translate(100 42) rotate(62)"/>
    <use href="#th-leaf" transform="translate(97 42) rotate(-6)"/>
    <use href="#th-leaf" transform="translate(84 24) rotate(-104)"/>
    <use href="#th-leaf" transform="translate(116 24) rotate(104)"/>
    <use href="#th-leaf" transform="translate(85 50) rotate(-96)"/>
    <use href="#th-leaf" transform="translate(115 50) rotate(96)"/>
    <use href="#th-leaf" transform="translate(71 64) rotate(-112)"/>
    <use href="#th-leaf" transform="translate(129 64) rotate(112)"/>
    <use href="#th-leaf" transform="translate(53 46) rotate(-72)"/>
    <use href="#th-leaf" transform="translate(147 46) rotate(72)"/>
    <use href="#th-leaf" transform="translate(48 105) rotate(168)"/>
    <use href="#th-leaf" transform="translate(152 105) rotate(-168)"/>
    <use href="#th-leaf" transform="translate(75 62) rotate(-118)"/>
    <use href="#th-leaf" transform="translate(125 62) rotate(118)"/>
    <use href="#th-leaf" transform="translate(60 68) rotate(-92)"/>
    <use href="#th-leaf" transform="translate(140 68) rotate(92)"/>
    <use href="#th-leaf" transform="translate(66 98) rotate(-158)"/>
    <use href="#th-leaf" transform="translate(134 98) rotate(158)"/>
    <use href="#th-leaf" transform="translate(92 96) rotate(-140)"/>
    <use href="#th-leaf" transform="translate(108 96) rotate(140)"/>
  </g>

  <!-- ============ family nodes woven into the canopy ============ -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.9" fill="none">
    <path d="M100 36.6 86 46"/>
    <path d="M100 36.6 114 46"/>
    <path d="M84 50.4 74 60"/>
    <path d="M116 50.4 126 60"/>
  </g>
  <g fill="#ffffff">
    <use href="#th-node" transform="translate(100 34)"/>
    <use href="#th-node" transform="translate(84 48)"/>
    <use href="#th-node" transform="translate(116 48)"/>
    <use href="#th-node" transform="translate(72 62)"/>
    <use href="#th-node" transform="translate(128 62)"/>
  </g>
</svg>
