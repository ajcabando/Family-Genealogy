<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.35" stop-color="#4338ca"/>
      <stop offset="0.6" stop-color="#7c3aed"/>
      <stop offset="0.8" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.4" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="800" cy="430" r="170" fill="url(#sun)"/>
  <circle cx="800" cy="430" r="72" fill="#fde68a"/>

  <!-- distant clouds -->
  <ellipse cx="320" cy="250" rx="220" ry="22" fill="#4338ca" opacity="0.35"/>
  <ellipse cx="1240" cy="220" rx="260" ry="26" fill="#4c1d95" opacity="0.3"/>

  <!-- sea -->
  <rect y="520" width="1600" height="380" fill="url(#water)"/>
  <!-- sun reflection -->
  <ellipse cx="800" cy="600" rx="160" ry="16" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="660" rx="100" ry="10" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="800" cy="720" rx="60" ry="8" fill="#fbbf24" opacity="0.22"/>
  <!-- gentle waves -->
  <path d="M0 560 Q 120 550 240 560 T 480 560 T 720 560 T 960 560 T 1200 560 T 1440 560 T 1600 560" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M0 640 Q 150 630 300 640 T 600 640 T 900 640 T 1200 640 T 1500 640 T 1600 640" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.2"/>

  <!-- beach sand -->
  <path d="M0 760 Q 400 730 800 760 T 1600 760 L1600 900 L0 900 Z" fill="#78350f"/>
  <path d="M0 790 Q 400 765 800 790 T 1600 790 L1600 900 L0 900 Z" fill="#451a03"/>

  <!-- family silhouettes -->
  <g fill="#0f172a" opacity="0.92">
    <!-- adult 1 -->
    <circle cx="520" cy="648" r="22"/>
    <path d="M520 668 L520 760 M520 690 L486 742 M520 690 L556 742 M520 700 L492 760 M520 700 L548 760"/>
    <!-- child 1 -->
    <circle cx="596" cy="690" r="16"/>
    <path d="M596 704 L596 760 M596 718 L572 756 M596 718 L620 756"/>
    <!-- adult 2 -->
    <circle cx="672" cy="638" r="24"/>
    <path d="M672 660 L672 760 M672 682 L634 738 M672 682 L712 738 M672 694 L640 760 M672 694 L704 760"/>
    <!-- child 2 -->
    <circle cx="748" cy="700" r="14"/>
    <path d="M748 712 L748 760 M748 726 L728 756 M748 726 L768 756"/>
    <!-- adult 3 (far) -->
    <circle cx="856" cy="660" r="18"/>
    <path d="M856 676 L856 760 M856 700 L830 748 M856 700 L882 748"/>
    <!-- child 3 small -->
    <circle cx="928" cy="712" r="11"/>
    <path d="M928 722 L928 760 M928 732 L912 756 M928 732 L944 756"/>
  </g>

  <!-- palm tree far left -->
  <g>
    <path d="M120 900 Q 128 760 140 660" stroke="#0f172a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M140 660 Q 92 630 60 600 M140 660 Q 110 596 88 576 M140 660 Q 150 600 190 566 M140 660 Q 186 630 216 616" stroke="#0f172a" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>