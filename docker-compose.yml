services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family}
      POSTGRES_DB: family_archive
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_archive"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3844:3844"
    environment:
      DATABASE_URL: postgresql://family:${POSTGRES_PASSWORD:-family}@db:5432/family_archive
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      FAMILY_ADMIN_EMAIL: ${FAMILY_ADMIN_EMAIL:?Set FAMILY_ADMIN_EMAIL in .env.production}
      FAMILY_ADMIN_PASSWORD: ${FAMILY_ADMIN_PASSWORD:?Set FAMILY_ADMIN_PASSWORD in .env.production}
      UPLOAD_DIR: /data/uploads
      APP_URL: ${APP_URL:-http://localhost:3844}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
